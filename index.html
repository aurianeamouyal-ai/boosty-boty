<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boosty Boty — AI-Powered Active Aging Coach</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --teal:#075E54;--teal-light:#128C7E;--green:#25D366;
      --gold:#C9A030;--gold-light:#D4BD7E;--coral:#C47058;
      --navy:#1C2A35;--dark:#303030;
      --cream:#FAF8F5;--beige:#E9E4DC;--beige-light:#F7F4EF;
      --card:#FFFDF8;
    }
    body{font-family:'Source Sans 3',sans-serif;background:var(--cream);color:var(--dark);-webkit-font-smoothing:antialiased;font-size:18px;line-height:1.65;overflow-x:hidden}
    .serif{font-family:'Cormorant Garamond',Georgia,serif}

    /* ═══ ANIMATIONS ═══ */
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes breathe{0%,100%{transform:scale(1);box-shadow:0 0 0 0 #25D36644}50%{transform:scale(1.06);box-shadow:0 0 40px 10px #25D36618}}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    @keyframes dotPulse{0%,80%,100%{transform:scale(.55);opacity:.3}40%{transform:scale(1);opacity:1}}
    @keyframes pulseRed{0%,100%{box-shadow:0 0 0 0 #C4705833}50%{box-shadow:0 0 0 8px #C4705800}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .fade-up{animation:fadeUp .8s ease forwards}
    .fd1{animation:fadeUp .8s ease .2s forwards;opacity:0}
    .fd2{animation:fadeUp .8s ease .4s forwards;opacity:0}
    .fd3{animation:fadeUp .8s ease .6s forwards;opacity:0}
    .fd4{animation:fadeUp .8s ease .8s forwards;opacity:0}
    .fd5{animation:fadeUp .8s ease 1s forwards;opacity:0}

    /* ═══ LANDING ═══ */
    .landing{min-height:100vh;background:linear-gradient(170deg,var(--card) 0%,var(--beige-light) 40%,var(--beige) 100%);position:relative}
    .stat-card{background:var(--card);border:1.5px solid #D4CFC6;border-radius:20px;padding:34px 28px;text-align:center;transition:transform .3s,box-shadow .3s}
    .stat-card:hover{transform:translateY(-3px);box-shadow:0 14px 44px #075E5410}
    .stat-num{font-family:'Cormorant Garamond',serif;font-size:50px;font-weight:700;color:var(--teal);line-height:1}
    .cta{display:inline-flex;align-items:center;gap:14px;padding:22px 48px;background:var(--teal);color:var(--card);border:none;border-radius:60px;font-size:21px;font-weight:600;font-family:'Source Sans 3',sans-serif;cursor:pointer;transition:all .35s;box-shadow:0 6px 28px #075E5430}
    .cta:hover{background:var(--teal-light);transform:translateY(-2px)}

    /* ═══ CHAT — PRESENTATION STYLE (not WhatsApp) ═══ */
    .chat-page{min-height:100vh;background:linear-gradient(170deg,var(--card) 0%,var(--beige-light) 100%)}
    .chat-shell{max-width:600px;margin:0 auto;padding:0 20px}

    /* Header bar */
    .ch-hdr{display:flex;align-items:center;gap:14px;padding:20px 0;border-bottom:1.5px solid #E0DBD3}
    .ch-av{width:52px;height:52px;border-radius:50%;overflow:hidden;background:var(--beige);display:flex;align-items:center;justify-content:center;font-size:28px}
    .ch-av img{width:100%;height:100%;object-fit:cover}
    .ch-back{background:none;border:none;font-size:26px;cursor:pointer;color:var(--teal);padding:8px;border-radius:10px}
    .ch-back:hover{background:#075E540A}

    /* Message area */
    .ch-msgs{padding:24px 0;display:flex;flex-direction:column;gap:20px;min-height:calc(100vh - 180px)}

    /* Boosty card (bot message) */
    .boosty-card{background:var(--card);border:1.5px solid #E0DBD3;border-radius:20px;padding:24px 28px;box-shadow:0 2px 12px #075E5408;animation:slideUp .4s ease forwards}
    .boosty-card-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .boosty-card-av{width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--beige);display:flex;align-items:center;justify-content:center;font-size:18px}
    .boosty-card-av img{width:100%;height:100%;object-fit:cover}
    .boosty-card-name{font-weight:700;color:var(--teal);font-size:15px}
    .boosty-card-text{font-size:19px;line-height:1.7;color:var(--dark);white-space:pre-wrap}

    /* User message */
    .user-msg{align-self:flex-end;max-width:80%;background:var(--teal);color:var(--card);padding:16px 24px;border-radius:20px 20px 4px 20px;font-size:18px;font-weight:500;animation:slideUp .3s ease forwards}

    /* ═══ BUTTONS ═══ */
    .card-btns{display:flex;flex-direction:column;gap:12px;margin-top:20px}
    .card-btn{padding:18px 28px;border:2.5px solid var(--teal);background:var(--card);color:var(--teal);border-radius:16px;font-size:19px;font-weight:600;font-family:'Source Sans 3',sans-serif;cursor:pointer;transition:all .25s;text-align:center;min-height:58px;display:flex;align-items:center;justify-content:center}
    .card-btn:hover{background:var(--teal);color:var(--card)}
    .card-btn:disabled{opacity:.4;cursor:not-allowed}
    .card-btn.sel{background:var(--teal);color:var(--card)}
    .card-skip{padding:14px 22px;background:transparent;border:1.5px dashed #B5AD9F;color:#7A7367;border-radius:14px;font-size:17px;font-family:'Source Sans 3',sans-serif;cursor:pointer;transition:all .25s;text-align:center}
    .card-skip:hover{border-color:#7A7367;color:var(--dark)}

    /* ═══ STOP BUTTON ═══ */
    .stop-btn{padding:18px;background:var(--card);border:3px solid var(--coral);color:var(--coral);border-radius:16px;font-size:19px;font-weight:700;font-family:'Source Sans 3',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;min-height:58px;margin-top:12px;animation:pulseRed 2.5s ease infinite;transition:all .25s}
    .stop-btn:hover{background:var(--coral);color:#fff}
    .stop-dot{width:16px;height:16px;border-radius:50%;background:var(--coral)}
    .stop-btn:hover .stop-dot{background:#fff}

    /* ═══ PROGRESS ═══ */
    .prog{display:flex;gap:10px;margin-top:18px;align-items:center}
    .prog-d{width:14px;height:14px;border-radius:50%;background:#D4CFC6;transition:all .4s;border:2px solid transparent}
    .prog-d.on{background:var(--teal);border-color:var(--teal-light);box-shadow:0 0 0 3px #075E5420}
    .prog-l{font-size:15px;color:var(--teal-light);margin-left:10px;font-weight:600}

    /* ═══ TIMER ═══ */
    .tmr{display:flex;flex-direction:column;align-items:center;margin:28px 0 16px}
    .tmr-out{width:150px;height:150px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center}
    .tmr-ring{position:absolute;inset:0;border-radius:50%;border:3px solid #D4CFC6}
    .tmr-spin{position:absolute;inset:0;border-radius:50%;border:4px solid var(--green);border-top-color:transparent;border-right-color:transparent;animation:spin 3s linear infinite}
    .tmr-in{width:130px;height:130px;border-radius:50%;background:linear-gradient(150deg,var(--beige-light),var(--card));display:flex;flex-direction:column;align-items:center;justify-content:center;animation:breathe 4s ease-in-out infinite}
    .tmr-s{font-family:'Cormorant Garamond',serif;font-size:48px;font-weight:700;color:var(--teal);line-height:1}
    .tmr-l{font-size:14px;color:#7A7367;margin-top:3px}
    .tmr-br{margin-top:12px;font-size:17px;color:var(--teal-light);font-weight:600}

    /* ═══ WHY BOX ═══ */
    .why{margin-top:16px;padding:16px 20px;background:#075E5408;border-left:4px solid var(--teal-light);border-radius:0 14px 14px 0;font-size:17px;color:var(--teal);line-height:1.6}
    .why-t{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;color:var(--teal-light)}

    /* ═══ INPUT ═══ */
    .ch-inp{position:sticky;bottom:0;padding:16px 0 24px;background:linear-gradient(transparent,var(--beige-light) 20%);display:flex;gap:10px;align-items:center}
    .inp{flex:1;padding:16px 24px;border:2px solid #D4CFC6;border-radius:16px;font-size:19px;font-family:'Source Sans 3',sans-serif;color:var(--dark);background:var(--card);outline:none;transition:border-color .3s}
    .inp:focus{border-color:var(--teal)}
    .inp::placeholder{color:#A39B8F}
    .snd{width:54px;height:54px;border-radius:16px;border:none;background:var(--teal);color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;flex-shrink:0}
    .snd:hover{background:var(--teal-light)}
    .snd:disabled{opacity:.3;cursor:not-allowed}

    /* ═══ TYPING ═══ */
    .typ{display:flex;gap:7px;align-items:center;padding:4px 0}
    .typ-d{width:9px;height:9px;border-radius:50%;background:#7A736755}
    .typ-d:nth-child(1){animation:dotPulse 1.4s ease infinite 0s}
    .typ-d:nth-child(2){animation:dotPulse 1.4s ease infinite .2s}
    .typ-d:nth-child(3){animation:dotPulse 1.4s ease infinite .4s}

    .ld-bar{height:3px;background:linear-gradient(90deg,var(--beige) 25%,#25D36650 50%,var(--beige) 75%);background-size:200% 100%;animation:shimmer 1.5s ease infinite}

    @media(max-width:768px){
      .stat-num{font-size:40px}
      .cta{padding:20px 36px;font-size:19px}
      .sg{grid-template-columns:1fr!important}
      .ch-msgs{min-height:calc(100vh - 200px)}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;

const WEBHOOK_URL="https://auriane.app.n8n.cloud/webhook/boosty-boty-chat";
const USER_ID="00000000-0000-0000-0000-000000000001";
const BOOSTY="Boosty.png";

/* ─── ROBUST JSON PARSER ─── */
function parseBot(raw) {
  let text = raw || "";
  let buttons = [];
  let timer = null;
  let progress = null;
  let why = null;

  // Try multiple JSON extraction strategies
  try {
    // Strategy 1: raw string is JSON
    const direct = JSON.parse(text);
    if (direct.response_text) return extract(direct);
  } catch(e) {}

  try {
    // Strategy 2: ```json ... ```
    const m1 = text.match(/```json\s*([\s\S]*?)```/);
    if (m1) { return extract(JSON.parse(m1[1])); }
  } catch(e) {}

  try {
    // Strategy 3: ``` ... ```
    const m2 = text.match(/```\s*([\s\S]*?)```/);
    if (m2) { return extract(JSON.parse(m2[1])); }
  } catch(e) {}

  try {
    // Strategy 4: find JSON object with response_text
    const m3 = text.match(/\{[\s\S]*"response_text"\s*:\s*"[\s\S]*?\}[\s\S]*?\}/);
    if (m3) { return extract(JSON.parse(m3[0])); }
  } catch(e) {}

  try {
    // Strategy 5: find any JSON object
    const m4 = text.match(/\{[\s\S]*\}/);
    if (m4) {
      const parsed = JSON.parse(m4[0]);
      if (parsed.response_text) return extract(parsed);
    }
  } catch(e) {}

  // Strategy 6: clean up raw text - remove JSON artifacts
  text = text.replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();
  // If it still looks like broken JSON, try to extract response_text
  const rtMatch = text.match(/"response_text"\s*:\s*"((?:[^"\\]|\\.)*)"/);
  if (rtMatch) {
    text = rtMatch[1].replace(/\\n/g, '\n').replace(/\\"/g, '"');
  }

  return { text, buttons, timer, progress, why };
}

function extract(j) {
  const t = j.timer;
  const timerSec = t && typeof t === 'object' && t.seconds ? t.seconds : (typeof t === 'number' ? t : null);
  const p = j.progress;
  const prog = p && typeof p === 'object' && p.total ? p : null;
  return {
    text: (j.response_text || "").replace(/\\n/g, '\n'),
    buttons: Array.isArray(j.buttons) ? j.buttons : [],
    timer: timerSec,
    progress: prog,
    why: j.why || (j.metadata && j.metadata.why) || null
  };
}

/* ─── TIMER ─── */
function Timer({seconds}) {
  const [r,setR]=useState(seconds);
  const [ph,setPh]=useState("in");
  useEffect(()=>{if(r<=0)return;const t=setTimeout(()=>setR(x=>x-1),1000);return()=>clearTimeout(t)},[r]);
  useEffect(()=>{const i=setInterval(()=>setPh(p=>p==="in"?"out":"in"),4000);return()=>clearInterval(i)},[]);
  const done=r<=0;
  return(
    <div className="tmr">
      <div className="tmr-out">
        <div className="tmr-ring"/>
        {!done&&<div className="tmr-spin"/>}
        <div className="tmr-in" style={done?{animation:"none"}:{}}>
          <span className="tmr-s">{done?"\u2713":r}</span>
          <span className="tmr-l">{done?"complete":"seconds"}</span>
        </div>
      </div>
      <div className="tmr-br" style={done?{color:"var(--green)",fontWeight:700}:{}}>
        {done?"Well done!":ph==="in"?"\u2191 Breathe in slowly...":"\u2193 Breathe out gently..."}
      </div>
    </div>
  );
}

/* ─── PROGRESS ─── */
function Progress({current,total}) {
  return(
    <div className="prog">
      {Array.from({length:total},(_,i)=><div key={i} className={"prog-d"+(i<current?" on":"")}/>)}
      <span className="prog-l">Step {current} of {total}</span>
    </div>
  );
}

/* ─── BODY MAP ─── */
const ZONES = [
  {id:'neck_shoulders', label:'Neck & Shoulders', y:72, color:'#075E54'},
  {id:'back', label:'Back', y:120, color:'#C9A030'},
  {id:'hips_lower_back', label:'Hips & Lower Back', y:168, color:'#C47058'},
  {id:'knees', label:'Knees', y:216, color:'#C9A030'},
  {id:'balance_ankles', label:'Balance & Ankles', y:264, color:'#075E54'}
];

function BodyMap({activeZone, answered}) {
  return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:32,margin:'20px 0'}}>
      <svg width="120" height="320" viewBox="0 0 120 320">
        {/* Head */}
        <circle cx="60" cy="30" r="22" fill="none" stroke="#D4CFC6" strokeWidth="2"/>
        {/* Body line */}
        <line x1="60" y1="52" x2="60" y2="280" stroke="#D4CFC6" strokeWidth="2"/>
        {/* Arms */}
        <line x1="20" y1="100" x2="100" y2="100" stroke="#D4CFC6" strokeWidth="2"/>
        {/* Legs */}
        <line x1="60" y1="220" x2="35" y2="300" stroke="#D4CFC6" strokeWidth="2"/>
        <line x1="60" y1="220" x2="85" y2="300" stroke="#D4CFC6" strokeWidth="2"/>
        {/* Zone ellipses */}
        {ZONES.map(z=>{
          const isActive = activeZone === z.id;
          const isDone = answered && answered.includes(z.id);
          return <ellipse key={z.id} cx="60" cy={z.y} rx="42" ry="20"
            fill={isActive ? z.color+'22' : 'none'}
            stroke={isDone ? '#25D366' : isActive ? z.color : z.color+'55'}
            strokeWidth={isActive ? 3 : 1.5}
            strokeDasharray={isDone ? 'none' : isActive ? 'none' : '6 3'}
            style={{transition:'all .4s'}}
          />;
        })}
      </svg>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        {ZONES.map(z=>{
          const isActive = activeZone === z.id;
          const isDone = answered && answered.includes(z.id);
          return <div key={z.id} style={{display:'flex',alignItems:'center',gap:10,opacity:isActive?1:isDone?0.6:0.4,transition:'all .3s'}}>
            <div style={{width:14,height:14,borderRadius:'50%',background:isDone?'#25D366':z.color,transition:'all .3s'}}/>
            <span style={{fontSize:15,fontWeight:isActive?700:400,color:isActive?'var(--dark)':'#7A7367'}}>{z.label} {isDone?'✓':''}</span>
          </div>;
        })}
      </div>
    </div>
  );
}

function detectBodyZone(text) {
  const t = (text||'').toLowerCase();
  if(t.includes('neck') || t.includes('shoulder') || t.includes('צוואר')) return 'neck_shoulders';
  if(t.includes('hips') || t.includes('lower back') || t.includes('מותניים')) return 'hips_lower_back';
  if((t.includes('your back') || t.includes('the back') || t.match(/\bback\b.*feeling/)) || t.includes('גב')) return 'back';
  if(t.includes('knee') || t.includes('ברכיים')) return 'knees';
  if(t.includes('balance') || t.includes('ankle') || t.includes('שיווי')) return 'balance_ankles';
  return null;
}

/* ─── BOT MESSAGE (Card Style) ─── */
function BotCard({msg,onSend,disabled,allMsgs}) {
  const {text,buttons,timer,progress,why} = parseBot(msg.text);
  const [clicked,setClicked]=useState(null);
  const [multiSel,setMultiSel]=useState([]);
  const isExercise=!!timer;
  const bodyZone = detectBodyZone(text);

  // Detect multi-select mode
  const isMulti = /pick \d|choose \d|select \d|בחר \d/i.test(text);

  const click=b=>{
    const v=b.value||b.label||b;
    const l=b.label||b;
    if(isMulti && !clicked){
      setMultiSel(prev=>prev.find(x=>x.v===v)?prev.filter(x=>x.v!==v):[...prev,{v,l}]);
    } else {
      setClicked(v);
      onSend(v,l);
    }
  };

  const confirmMulti=()=>{
    if(multiSel.length===0)return;
    const values=multiSel.map(x=>x.v).join(', ');
    const labels=multiSel.map(x=>x.l).join(', ');
    setClicked(values);
    onSend(values,labels);
  };

  // Find previously answered zones from all messages
  const answeredZones = [];
  if(allMsgs) {
    const zoneOrder = ['neck_shoulders','back','hips_lower_back','knees','balance_ankles'];
    allMsgs.forEach(m=>{
      if(m.role==='bot'){
        const z = detectBodyZone(typeof m.text==='string'?m.text:'');
        if(z && !answeredZones.includes(z)){
          // Check if there's a user reply after this
          const idx = allMsgs.indexOf(m);
          if(idx < allMsgs.length-1 && allMsgs[idx+1] && allMsgs[idx+1].role==='user') answeredZones.push(z);
        }
      }
    });
  }

  return(
    <div className="boosty-card">
      <div className="boosty-card-hdr">
        <div className="boosty-card-av"><img src={BOOSTY} alt="B" onError={e=>{e.target.style.display="none";e.target.parentNode.textContent="\uD83D\uDC3E"}}/></div>
        <span className="boosty-card-name">Boosty</span>
      </div>
      <div className="boosty-card-text">{text}</div>

      {bodyZone&&<BodyMap activeZone={bodyZone} answered={answeredZones}/>}

      {why&&<div className="why"><div className="why-t">Why this exercise</div>{why}</div>}
      {timer&&<Timer seconds={timer}/>}
      {progress&&<Progress current={progress.current} total={progress.total}/>}

      {buttons.length>0&&(
        <div className="card-btns">
          {buttons.map((b,i)=>{
            const l=b.label||b;const v=b.value||b.label||b;
            const isSel = isMulti ? multiSel.find(x=>x.v===v) : clicked===v;
            return <button key={i} className={"card-btn"+(isSel?" sel":"")} onClick={()=>click(b)} disabled={disabled||clicked!==null}>{l}</button>
          })}
          {isMulti&&!clicked&&multiSel.length>0&&(
            <button className="card-btn" style={{background:'var(--teal)',color:'var(--card)',fontWeight:700}} onClick={confirmMulti} disabled={disabled}>Confirm ({multiSel.length} selected)</button>
          )}
          {!clicked&&!isMulti&&<button className="card-skip" onClick={()=>{setClicked('skip');onSend('skip','Skip')}} disabled={disabled||clicked!==null}>Skip for now — that's okay</button>}
          {!clicked&&isMulti&&<button className="card-skip" onClick={()=>{setClicked('skip');onSend('skip','Skip')}} disabled={disabled||clicked!==null}>Skip for now — that's okay</button>}
        </div>
      )}

      {isExercise&&<button className="stop-btn" onClick={()=>onSend("I feel pain and need to stop","⚠️ Stop — pain/dizziness")} disabled={disabled}><div className="stop-dot"/>Stop — I feel pain or dizziness</button>}
    </div>
  );
}

/* ─── TYPING ─── */
function Typing() {
  return(
    <div className="boosty-card" style={{padding:"18px 28px"}}>
      <div className="boosty-card-hdr" style={{marginBottom:4}}>
        <div className="boosty-card-av"><img src={BOOSTY} alt="B" onError={e=>{e.target.style.display="none";e.target.parentNode.textContent="\uD83D\uDC3E"}}/></div>
        <span className="boosty-card-name">Boosty</span>
      </div>
      <div className="typ"><div className="typ-d"/><div className="typ-d"/><div className="typ-d"/></div>
    </div>
  );
}

/* ═══ LANDING ═══ */
function Landing({onStart}) {
  return(
    <div className="landing">
      <div style={{maxWidth:960,margin:"0 auto",padding:"60px 28px"}}>
        <div className="fade-up" style={{display:"flex",alignItems:"center",gap:12,marginBottom:60}}>
          <img src={BOOSTY} alt="Boosty" style={{width:48,height:48,borderRadius:"50%"}} onError={e=>{e.target.style.display="none"}}/>

        </div>

        <div style={{display:"flex",alignItems:"center",gap:60,flexWrap:"wrap",marginBottom:80}}>
          <div style={{flex:"1 1 400px",maxWidth:560}}>
            <p className="fade-up" style={{fontSize:15,fontWeight:700,letterSpacing:2.5,color:"var(--teal)",textTransform:"uppercase",marginBottom:22}}>University of Haifa &middot; Active Aging AI</p>
            <h1 className="serif fd1" style={{fontSize:"clamp(36px,5vw,58px)",fontWeight:600,lineHeight:1.15,color:"var(--navy)",marginBottom:28}}>Every year, 1 in 4 adults<br/>over 65 <span style={{color:"var(--teal)"}}>experience a fall.</span></h1>
            <p className="fd2" style={{fontSize:21,lineHeight:1.75,color:"#303030BB",maxWidth:480}}>But the real fear isn't falling. It's losing the freedom to live on your own terms.</p>

          <div className="fd2" style={{flex:"0 0 auto",animation:"float 3s ease-in-out infinite"}}>
            <img src={BOOSTY} alt="Boosty" style={{width:200,height:200,borderRadius:30}} onError={e=>{e.target.style.display="none"}}/>
          </div>
        </div>

        <div className="fd3 sg" style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:22,marginBottom:80}}>

          <div className="stat-card"><div className="stat-num" style={{color:"var(--gold)"}}>24%</div><p style={{fontSize:17,color:"#30303088",marginTop:10,lineHeight:1.55}}>Fall reduction from<br/>targeted balance programs</p><p style={{fontSize:13,color:"var(--teal)",marginTop:8,fontWeight:700}}>WHO / BMJ</p></div>
        </div>

        <div className="fd4" style={{maxWidth:620,marginBottom:64}}>
          <p className="serif" style={{fontSize:"clamp(22px,3vw,31px)",lineHeight:1.65,color:"var(--navy)",fontWeight:400,fontStyle:"italic"}}>What if technology could do more than count steps? What if it could sense loneliness, protect independence, and quietly reduce the pressure on healthcare?</p>
        </div>

        <div className="fd5"><button className="cta" onClick={onStart}>See how it works <span style={{fontSize:22}}>&rarr;</span></button></div>
        <p style={{marginTop:120,fontSize:14,color:"#1C2A353D",fontWeight:500}}>University of Haifa &middot; Boosty Boty Initiative &middot; 2026</p>
      </div>
    </div>
  );
}

/* ═══ CHAT ═══ */
function ChatPage({onBack}) {
  const [msgs,setMsgs]=useState([]);
  const [inp,setInp]=useState("");
  const [ld,setLd]=useState(false);
  const [sid]=useState(()=>"s-"+Date.now());
  const ref=useRef(null);
  const init=useRef(false);

  useEffect(()=>{ref.current?.scrollIntoView({behavior:"smooth"})},[msgs,ld]);

  // Silently trigger Boosty's greeting (no user bubble)
  useEffect(()=>{
    if(!init.current){
      init.current=true;
      (async()=>{
        setLd(true);
        try{
          const res=await fetch(WEBHOOK_URL,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({session_id:sid,user_id:USER_ID,message:"Hello",platform:"web",metadata:{location:"haifa",step:"onboarding"}})
          });
          const data=await res.json();
          setMsgs([{role:"bot",text:typeof data==="string"?data:JSON.stringify(data)}]);
        }catch(e){
          setMsgs([{role:"bot",text:"Welcome! I'm Boosty, your personal coach. What's your name?"}]);
        }
        setLd(false);
      })();
    }
  },[]);

  const send=async(text,displayText)=>{
    if(!text.trim()||ld)return;
    setMsgs(p=>[...p,{role:"user",text:displayText||text}]);
    setLd(true);
    try{
      const res=await fetch(WEBHOOK_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({session_id:sid,user_id:USER_ID,message:text,platform:"web",metadata:{location:"haifa",step:"onboarding"}})
      });
      const data=await res.json();
      setMsgs(p=>[...p,{role:"bot",text:typeof data==="string"?data:JSON.stringify(data)}]);
    }catch(e){
      setMsgs(p=>[...p,{role:"bot",text:"Having trouble connecting. Let's try again in a moment."}]);
    }
    setLd(false);
  };

  const go=()=>{if(inp.trim()&&!ld){send(inp);setInp("")}};

  return(
    <div className="chat-page">
      <div className="chat-shell">
        {/* Header */}
        <div className="ch-hdr">
          <button className="ch-back" onClick={onBack}>&larr;</button>
          <div className="ch-av"><img src={BOOSTY} alt="Boosty" onError={e=>{e.target.style.display="none";e.target.parentNode.textContent="\uD83D\uDC3E"}}/></div>
          <div>
            <div style={{fontWeight:700,fontSize:20,color:"var(--teal)"}}>Boosty</div>
            <div style={{fontSize:14,color:"#7A7367"}}>Your personal coach</div>
          </div>
        </div>

        {ld&&<div className="ld-bar"/>}

        {/* Messages */}
        <div className="ch-msgs">
          {msgs.map((m,i)=>
            m.role==="user"
              ? <div key={i} className="user-msg">{m.text}</div>
              : <BotCard key={i} msg={m} onSend={send} disabled={ld} allMsgs={msgs}/>
          )}
          {ld&&<Typing/>}
          <div ref={ref}/>
        </div>

        {/* Input */}
        <div className="ch-inp">
          <input className="inp" value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();go()}}} placeholder="Type a message..." disabled={ld}/>
          <button className="snd" onClick={go} disabled={!inp.trim()||ld}>&uarr;</button>
        </div>
      </div>
    </div>
  );
}

/* ═══ APP ═══ */
function App(){
  const[p,setP]=useState("landing");
  return p==="landing"?<Landing onStart={()=>setP("chat")}/>:<ChatPage onBack={()=>setP("landing")}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
